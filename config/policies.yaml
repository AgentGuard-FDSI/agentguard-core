
version: 1

session:
  # Área y nivel jerárquico salen de la sesión autenticada, nunca del prompt.
  identity_source: session


# Datos propios de la organización. AgentGuard no conoce el negocio: para otra empresa se cambian
# este bloque, las áreas y las herramientas, no el código.
#   dominio_corporativo         : dominio de correo de la empresa (recipient_in: dominio_corporativo)
#   aprobador_ultima_instancia  : área que respalda las aprobaciones humanas (HITL)
organizacion:
  dominio_corporativo: andimarket.example.test
  aprobador_ultima_instancia: gerencia

# Verificador de entrada: revisa el prompt ANTES de que el agente elija una herramienta. Usa reglas
# (patrones por tema en agentguard/input_rules.py), no un LLM. Si hay coincidencia, responde con el
# rechazo estándar y notifica a notificar_area. Solo ve el prompt del usuario: la inyección indirecta
# (dentro del resultado de una herramienta) la contienen las restricciones por argumento y el HITL.
#   area_propietaria: el tema no se rechaza para su área dueña, y para las demás cuenta como acceso
#                     entre áreas (regla_entre_areas).
verificador_entrada:
  habilitado: true
  temas: [pii_masiva, datos_de_pago, credenciales, config_interna]
  notificar_area: tecnologia_ti
  mensaje_rechazo: "No puedo ayudarte con esta solicitud."
  area_propietaria:
    config_interna: tecnologia_ti

# Regla de acceso entre áreas (estática, sin historial ni aprendizaje). Si una sesión pide un recurso
# propio de otra área (herramienta fuera de rol, tabla de otra área o tema de entrada de otra área),
# la acción es BLOCK y se notifica al área propietaria. Si el mismo usuario lo repite `intentos` veces
# en `ventana_minutos`, se emite una alerta prioritaria a notificar_alerta (posible cuenta comprometida).
regla_entre_areas:
  habilitada: true
  alerta_tras: {intentos: 3, ventana_minutos: 10}
  notificar_alerta: tecnologia_ti

areas:
  atencion_cliente:
    description: Atención al cliente
    levels: [empleado, jefe]

  logistica_operaciones:
    description: Logística y operaciones
    levels: [empleado, jefe]

  marketing_comunicaciones:
    description: Marketing y comunicaciones
    levels: [empleado, jefe]

  tecnologia_ti:
    description: Tecnología (recibe las alertas de seguridad)
    levels: [empleado, jefe]

  finanzas:
    description: Finanzas
    levels: [empleado, jefe]

  gerencia:
    description: Gerencia transversal; sin herramientas operativas, aprobador de última instancia
    levels: [gerente]

# -----------------------------------------------------------------------------
#   areas  : áreas que pueden invocar la herramienta (fuera de rol = BLOCK)
#   risk   : LOW | MEDIUM | HIGH | CRITICAL
#   action : ALLOW | BLOCK | HITL  (acción base cuando el área sí está autorizada)
#   args   : restricciones por argumento; un argumento fuera de lo permitido
#            produce BLOCK aunque el área tenga la herramienta
# -----------------------------------------------------------------------------
tools:
  consultar_pedido:
    areas: [atencion_cliente, logistica_operaciones]
    risk: LOW
    action: ALLOW

  actualizar_pedido:
    areas: [atencion_cliente, logistica_operaciones]
    risk: MEDIUM
    action: HITL
    args:
      max_items_per_request: 5

  eliminar_pedido:
    areas: [logistica_operaciones]
    risk: HIGH
    action: HITL
    args:
      max_items_per_request: 1

  enviar_correo:
    areas: [atencion_cliente, marketing_comunicaciones]
    risk: HIGH
    action: HITL
    args:
      recipient_in: [clientes_registrados, dominio_corporativo]

  leer_base_datos:
    areas: [finanzas, tecnologia_ti]
    risk: MEDIUM
    action: ALLOW
    args:
      table_by_area:
        finanzas: [pagos, pedidos]
        tecnologia_ti: [config_ti, audit_logs]

  admin_action:
    areas: [tecnologia_ti]
    risk: CRITICAL
    action: BLOCK
