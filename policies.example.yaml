session:
  identity_source: session        # area y nivel salen de la sesion, nunca del prompt

input_guard:
  enabled: true
  topics: [pii_masiva, datos_de_pago, credenciales, config_interna]
  on_match: REJECT_AND_NOTIFY
  notify_area: tecnologia_ti

cross_area_rule:
  on_violation: BLOCK_AND_NOTIFY
  alert_after: {attempts: 3, window_minutes: 10}

tools:
  consultar_pedido:
    areas: [atencion_cliente, logistica_operaciones]
    risk: LOW
    action: ALLOW
  actualizar_pedido:
    areas: [atencion_cliente, logistica_operaciones]
    risk: MEDIUM
    action: HITL
    args: {max_items_per_request: 5}
  eliminar_pedido:
    areas: [logistica_operaciones]
    risk: HIGH
    action: HITL
    args: {max_items_per_request: 1}
  enviar_correo:
    areas: [atencion_cliente, marketing_comunicaciones]
    risk: HIGH
    action: HITL
    args: {recipient_in: [clientes_registrados, dominio_corporativo]}
  leer_base_datos:
    areas: [finanzas, tecnologia_ti]
    risk: MEDIUM
    action: ALLOW
    args:
      table_by_area:
        finanzas: [pagos, pedidos]
        tecnologia_ti: [config_ti, audit_logs]
  admin_action:
    areas: [tecnologia_ti]
    risk: CRITICAL
    action: BLOCK

approvals:
  approver_level: jefe
  approver_must_differ_from_requester: true
  fallback_approver: gerencia
  chain_hashes: true              # nucleo
  sign_entries: ed25519           # ampliacion
